# Local development infrastructure.
#
# NOTE: no MongoDB. The catalog lives in Postgres (JSONB where the shape really
# does vary). See docs/DECISIONS/ADR-0001-polyglot-persistence.md — the split was
# reversed on 2026-08-06.

name: cinefund

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cinefund
      POSTGRES_PASSWORD: cinefund
      POSTGRES_DB: cinefund
    ports:
      # 5433 on the host: a local PostgreSQL service commonly owns 5432, and a
      # hard conflict that silently connects the app to the wrong database is
      # not worth the ten seconds of namespace isolation it buys.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinefund -d cinefund"]
      interval: 5s
      timeout: 3s
      retries: 10

   redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # PgBouncer — transaction pooling so 50 cuncurrent webhooks don't hold 50 pg conns.
  # Use POSTGRES_DSN=postgres://cinefund:cinefund@localhost:6432/cinefund?sslmode=disable to route via it.
  pgbouncer:
    image: edoburu/pgbouncer:1.22.1
    environment:
      DATABASE_URL: "postgres://cinefund:cinefund@postgres:5432/cinefund"
      POOL_MODE: "transaction"
      MAX_CLIENT_CONN: "100"
      DEFAULT_POOL_SIZE: "20"
      RESERVE_POOL_SIZE: "5"
      RESERVE_POOL_TIMEOUT: "2"
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy

  # Kafka in KRaft mode - no ZooKeeper.
  kafka:
    image: bitnamilegacy/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    volumes:
      - kafkadata:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create the buckets, then exit. Both buckets stay PRIVATE - every
  # read goes through a presigned URL. See docs/10 and acceptance check S0.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/cinefund-originals &&
      mc mb --ignore-existing local/cinefund-media &&
      mc anonymous set none local/cinefund-originals &&
      mc anonymous set none local/cinefund-media &&
      echo 'buckets ready'
      "

volumes:
  pgdata:
  kafkadata:
  miniodata:
